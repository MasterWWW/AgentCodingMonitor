<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#fff5f8" />
  <title>萌宠看板 · Vibe Monitor</title>
  <style>
    :root {
      color-scheme: light;
      --bg-top: #fff7e8;
      --bg-bottom: #e8f4ff;
      --text: #4a3f55;
      --muted: #9b8faa;
      --card: #ffffff;
      --pixel: #4a3f55;
      --shadow: rgba(74, 63, 85, 0.34);
      --green: #86efac;
      --green-bg: #ecfdf5;
      --amber: #fcd34d;
      --amber-bg: #fffbeb;
      --purple: #ddd6fe;
      --purple-bg: #f5f3ff;
      --pink: #fbcfe8;
      font-family: "Courier New", "Lucida Console", Monaco, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background:
        repeating-linear-gradient(0deg, rgba(74, 63, 85, 0.04) 0 2px, transparent 2px 16px),
        repeating-linear-gradient(90deg, rgba(74, 63, 85, 0.035) 0 2px, transparent 2px 16px),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: max(8px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .scene-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.6s ease;
    }

    .scene-overlay.day::before,
    .scene-overlay.day::after {
      content: "";
      position: absolute;
      opacity: 0.8;
    }

    .scene-overlay.day::before {
      width: 32px; height: 16px;
      top: 12%; left: 8%;
      background: #fff;
      box-shadow: 16px 0 0 #fff, 32px 0 0 #fff, 8px -16px 0 #fff, 24px -16px 0 #fff;
      animation: cloud-drift 24s steps(4, end) infinite alternate;
    }

    .scene-overlay.day::after {
      width: 24px; height: 16px;
      top: 18%; right: 12%;
      background: #fff;
      box-shadow: 16px 0 0 #fff, 8px -16px 0 #fff, 32px 0 0 rgba(255,255,255,0.75);
      animation: cloud-drift 20s steps(4, end) infinite alternate-reverse;
    }

    .scene-overlay.night::before {
      content: "";
      position: absolute;
      top: 10%; right: 15%;
      width: 16px;
      height: 16px;
      background: #fff4a3;
      box-shadow: 16px 0 0 #fff4a3, 0 16px 0 #fff4a3, 16px 16px 0 #fff4a3, 32px 16px 0 rgba(255,244,163,0.55);
      animation: moon-glow 3s steps(2, end) infinite;
    }

    .scene-overlay.night::after {
      content: "";
      position: absolute;
      top: 8%; left: 10%;
      width: 6px;
      height: 6px;
      background: #fff;
      box-shadow: 80px 28px 0 #fff, 150px 4px 0 #fff, 220px 42px 0 #fff;
      animation: twinkle 2s steps(2, end) infinite alternate;
    }

    @keyframes cloud-drift {
      from { transform: translateX(0); }
      to { transform: translateX(16px); }
    }

    @keyframes moon-glow {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes twinkle {
      from { opacity: 0.4; }
      to { opacity: 0.9; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: calc(100dvh - 28px);
    }

    /* ── 宠物舞台 ── */
    .pet-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 0 16px;
      min-height: 470px;
    }

    .scene-bg {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110%;
      height: 76px;
      background:
        repeating-linear-gradient(90deg, rgba(74,63,85,0.08) 0 8px, transparent 8px 16px),
        linear-gradient(180deg, rgba(134,239,172,0.05) 0 20%, rgba(134,239,172,0.7) 20% 100%);
      border-top: 4px solid var(--pixel);
      pointer-events: none;
    }

    .pet-stage.scene-night .scene-bg {
      background:
        repeating-linear-gradient(90deg, rgba(74,63,85,0.08) 0 8px, transparent 8px 16px),
        linear-gradient(180deg, rgba(221,214,254,0.05) 0 20%, rgba(196,181,253,0.65) 20% 100%);
    }

    .speech-bubble {
      position: relative;
      background: var(--card);
      border: 3px solid var(--pixel);
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: 5px 5px 0 var(--shadow);
      max-width: 90%;
      text-align: center;
      margin-bottom: 12px;
      z-index: 3;
      animation: bubble-pop 0.4s ease;
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: var(--card);
      border-right: 3px solid var(--pixel);
      border-bottom: 3px solid var(--pixel);
      border-top: 0;
      border-left: 0;
      rotate: 45deg;
    }

    .pet-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .pet-name-tag {
      background: var(--card);
      border: 3px solid var(--pixel);
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: 4px 4px 0 var(--shadow);
      margin-bottom: 8px;
      z-index: 4;
    }

    .pet-container {
      width: min(260px, 62vw);
      height: min(260px, 62vw);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pet-container svg {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .pet-container.phase-active {
      animation: pet-bounce 0.8s steps(2, end) infinite;
    }

    .pet-container.phase-waiting {
      animation: pet-wiggle 0.8s steps(2, end) infinite;
    }

    .pet-container.phase-waiting::before {
      content: "";
      position: absolute;
      inset: -12px;
      border: 4px solid var(--amber);
      animation: pulse-ring 1s steps(2, end) infinite;
      pointer-events: none;
    }

    .pet-container.phase-stopped {
      animation: pet-celebrate 0.6s steps(2, end) 3;
    }

    @keyframes pet-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pet-wiggle {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(8px); }
    }

    @keyframes pet-celebrate {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(1.08); }
    }

    @keyframes bubble-pop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .task-bubble {
      background: var(--green-bg);
      border: 3px solid var(--pixel);
      border-left: 8px solid var(--green);
      border-radius: 4px;
      padding: 10px 16px;
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      font-weight: 600;
      color: var(--text);
      max-width: 92%;
      text-align: center;
      margin-top: 12px;
      word-break: break-word;
      z-index: 3;
      box-shadow: 5px 5px 0 var(--shadow);
    }

    .pet-stage.phase-waiting .task-bubble {
      background: var(--amber-bg);
      border-color: var(--pixel);
      border-left-color: var(--amber);
    }

    .meta-hint {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
      z-index: 3;
      text-shadow: 1px 1px 0 #fff;
    }

    /* ── 休息场景 ── */
    .resting-scene {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 0 20px;
      min-height: 470px;
      position: relative;
    }

    .resting-scene::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: 110%;
      height: 64px;
      background:
        repeating-linear-gradient(90deg, rgba(74,63,85,0.08) 0 8px, transparent 8px 16px),
        linear-gradient(180deg, rgba(196,181,253,0.12) 0 20%, rgba(196,181,253,0.64) 20% 100%);
      border-top: 4px solid var(--pixel);
      z-index: 0;
    }

    .resting-pets {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      z-index: 2;
      margin-bottom: 20px;
    }

    .resting-pets svg {
      width: 96px;
      height: 96px;
      opacity: 0.9;
      image-rendering: pixelated;
    }

    .resting-pets svg:nth-child(2) {
      width: 112px;
      height: 112px;
      transform: translateY(-10px);
    }

    .zzz-bubble {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--muted);
      animation: zzz-float 2.5s steps(3, end) infinite;
      z-index: 3;
      margin-bottom: 16px;
    }

    @keyframes zzz-float {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(-10px); opacity: 1; }
    }

    .rest-speech {
      background: var(--card);
      border: 3px solid var(--pixel);
      border-radius: 4px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      box-shadow: 5px 5px 0 var(--shadow);
      text-align: center;
      z-index: 3;
      margin-top: 12px;
    }

    /* ── 配对页 ── */
    .pairing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 0 24px;
    }

    .pairing-pets {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pairing-pets svg {
      width: 84px;
      height: 84px;
      image-rendering: pixelated;
      animation: peek 2s steps(2, end) infinite;
    }

    .pairing-pets svg:nth-child(2) { animation-delay: 0.3s; }
    .pairing-pets svg:nth-child(3) { animation-delay: 0.6s; }

    @keyframes peek {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pairing-card {
      background: var(--card);
      border: 3px solid var(--pixel);
      border-radius: 4px;
      padding: 24px 20px;
      box-shadow: 6px 6px 0 var(--shadow);
      width: 100%;
      line-height: 1.65;
    }

    .pairing-card h2 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .pairing-card > p {
      font-size: 0.92rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 12px;
    }

    .pairing-card ol {
      margin: 0 0 0 20px;
      font-size: 0.9rem;
      color: var(--text);
    }

    .pairing-card li { margin-bottom: 8px; }

    .hint-box {
      margin-top: 14px;
      padding: 12px 14px;
      border: 2px solid var(--pixel);
      border-radius: 4px;
      background: var(--purple-bg);
      font-size: 0.82rem;
      color: var(--muted);
    }

    .hint-box code {
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* ── 页脚 ── */
    .footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 8px 0 0;
      text-shadow: 1px 1px 0 #fff;
    }

    .conn-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 4px;
      vertical-align: middle;
      background: var(--muted);
    }

    .conn-dot.live {
      background: #4ade80;
      box-shadow: 2px 2px 0 rgba(74, 63, 85, 0.2);
    }

    .conn-dot.off { background: #f87171; }

    .hidden { display: none !important; }

    /* SVG 内部动画 */
    .pet-tail { transform-origin: 80% 80%; animation: tail-wag 0.6s steps(2, end) infinite alternate; }
    .pet-wing { transform-origin: center; animation: wing-flap 0.5s steps(2, end) infinite alternate; }
    .pet-paw { animation: paw-tap 0.4s steps(2, end) infinite alternate; }

    @keyframes tail-wag {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }

    @keyframes wing-flap {
      from { transform: rotate(-6deg); }
      to { transform: rotate(6deg); }
    }

    @keyframes paw-tap {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    .prop-keyboard { opacity: 0; transition: opacity 0.3s; }
    .phase-active .prop-keyboard { opacity: 1; }
    .prop-book { opacity: 0; transition: opacity 0.3s; }
    .phase-active .prop-book { opacity: 1; }
    .prop-wave { opacity: 0; transition: opacity 0.3s; }
    .phase-waiting .prop-wave { opacity: 1; }
  </style>
</head>
<body>
  <div class="scene-overlay day" id="sceneOverlay"></div>

  <div class="wrap">
    <!-- 配对页 -->
    <section id="pairingView" class="pairing hidden">
      <div class="pairing-pets" id="pairingPets"></div>
      <div class="pairing-card">
        <h2>要先和电脑做好朋友哦～</h2>
        <p>在运行 Vibe Monitor 的电脑上：</p>
        <ol>
          <li>打开托盘菜单，勾选「启用 iPad 看板」</li>
          <li>点击「复制看板链接」或扫描二维码</li>
          <li>用本页打开完整链接（含 <code>token=</code> 参数）</li>
        </ol>
        <div class="hint-box">
          iPad mini 4 无法通过网页保持常亮。请在「设置 → 显示与亮度 → 自动锁定」中选择「永不」，并建议插电使用。
        </div>
      </div>
    </section>

    <!-- 主看板 -->
    <main id="dashboardView" class="hidden" style="flex:1;display:flex;flex-direction:column;">

      <!-- 宠物舞台（有进行中会话） -->
      <section id="petStage" class="pet-stage hidden">
        <div class="scene-bg"></div>
        <div class="speech-bubble" id="speechBubble">…</div>
        <div class="pet-area">
          <div class="pet-name-tag" id="petNameTag">咪咪</div>
          <div class="pet-container" id="petContainer"></div>
        </div>
        <div class="task-bubble" id="taskBubble">…</div>
        <div class="meta-hint" id="metaHint"></div>
      </section>

      <!-- 休息场景（无进行中会话） -->
      <section id="restingView" class="resting-scene hidden">
        <div class="zzz-bubble">Zzz</div>
        <div class="resting-pets" id="restingPets"></div>
        <div class="rest-speech">大家都在打盹…呼…</div>
      </section>

    </main>

    <footer class="footer" id="footer">
      <span class="conn-dot off" id="connDot"></span>
      <span id="connText">🐾 正在找小伙伴…</span>
    </footer>
  </div>

  <script>
    const SOURCE_ORDER = ["cursor", "claude_code", "codex"];
    const IN_PROGRESS = ["active", "waiting_user"];
    const NEAR_DUPLICATE_MS = 2000;
    const DEFAULT_SOURCE = "cursor";

    /** 宠物角色配置 */
    const PETS = {
      cursor: { name: "咪咪", color: "#7048e8" },
      claude_code: { name: "狐狐", color: "#f97316" },
      codex: { name: "咕咕", color: "#14b8a6" },
    };

    /** 宠物第一人称语气（按来源 × phase） */
    const CUTE_SPEECH = {
      cursor: {
        active: "键盘敲得噼里啪啦～",
        waiting_user: "主人～喵需要你！",
        stopped: "喵！搞定啦～",
        idle: "在打盹… Zzz",
        unknown: "耳朵竖起来，等任务中…",
      },
      claude_code: {
        active: "嗯…让我想想怎么写…",
        waiting_user: "有个问题想问你～",
        stopped: "完美收工，尾巴摇～",
        idle: "蜷成一团睡觉中…",
        unknown: "眼镜推推，等灵感…",
      },
      codex: {
        active: "咕咕！代码在写了！",
        waiting_user: "咕？等你确认一下！",
        stopped: "咕咕！任务完成！",
        idle: "闭上眼，进入待机…",
        unknown: "咕咕？还没收到信号…",
      },
    };

    const params = new URLSearchParams(location.search);
    const token = params.get("token");

    const pairingView = document.getElementById("pairingView");
    const dashboardView = document.getElementById("dashboardView");
    const petStage = document.getElementById("petStage");
    const restingView = document.getElementById("restingView");
    const petContainer = document.getElementById("petContainer");
    const petNameTag = document.getElementById("petNameTag");
    const speechBubble = document.getElementById("speechBubble");
    const taskBubble = document.getElementById("taskBubble");
    const metaHint = document.getElementById("metaHint");
    const connDot = document.getElementById("connDot");
    const connText = document.getElementById("connText");
    const sceneOverlay = document.getElementById("sceneOverlay");
    const pairingPets = document.getElementById("pairingPets");
    const restingPets = document.getElementById("restingPets");

    let es = null;
    let pollTimer = null;
    let wakeLock = null;
    let lastUpdate = null;

    /* ── SVG 宠物渲染 ── */

    /** 渲染小猫（咪咪） */
    function svgCat(phase) {
      const sleeping = phase === "idle" || phase === "stopped";
      const eyes = sleeping
        ? '<rect x="56" y="70" width="14" height="4" fill="#4a3f55"/><rect x="84" y="70" width="14" height="4" fill="#4a3f55"/>'
        : '<rect x="58" y="66" width="10" height="12" fill="#4a3f55"/><rect x="86" y="66" width="10" height="12" fill="#4a3f55"/>'
          + '<rect x="60" y="68" width="3" height="3" fill="#fff"/><rect x="88" y="68" width="3" height="3" fill="#fff"/>';
      const wavePaw = phase === "waiting_user"
        ? '<g class="prop-wave"><rect x="112" y="84" width="14" height="14" fill="#fbcfe8" stroke="#7048e8" stroke-width="3"/><rect x="116" y="78" width="6" height="6" fill="#7048e8"/></g>'
        : "";
      const keyboard = phase === "active"
        ? '<g class="prop-keyboard"><rect x="28" y="128" width="96" height="24" fill="#e2e8f0" stroke="#4a3f55" stroke-width="3"/><rect x="36" y="136" width="8" height="6" fill="#94a3b8"/><rect x="50" y="136" width="8" height="6" fill="#94a3b8"/><rect x="64" y="136" width="8" height="6" fill="#94a3b8"/><rect x="78" y="136" width="8" height="6" fill="#94a3b8"/><rect x="92" y="136" width="8" height="6" fill="#94a3b8"/><rect x="106" y="136" width="8" height="6" fill="#94a3b8"/></g>'
        : "";
      return '<svg viewBox="0 0 150 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'
        + '<rect x="34" y="146" width="86" height="8" fill="rgba(74,63,85,0.15)"/>'
        + '<g class="pet-tail"><rect x="116" y="92" width="18" height="18" fill="#fbcfe8" stroke="#7048e8" stroke-width="3"/><rect x="132" y="76" width="14" height="18" fill="#fbcfe8" stroke="#7048e8" stroke-width="3"/></g>'
        + '<rect x="38" y="84" width="76" height="54" fill="#fbcfe8" stroke="#7048e8" stroke-width="4"/>'
        + '<polygon points="44,58 44,34 66,58" fill="#fbcfe8" stroke="#7048e8" stroke-width="4"/>'
        + '<polygon points="106,58 106,34 84,58" fill="#fbcfe8" stroke="#7048e8" stroke-width="4"/>'
        + '<rect x="44" y="52" width="62" height="52" fill="#fbcfe8" stroke="#7048e8" stroke-width="4"/>'
        + eyes
        + '<rect x="72" y="82" width="8" height="6" fill="#f472b6"/>'
        + '<rect x="70" y="92" width="4" height="4" fill="#7048e8"/><rect x="78" y="92" width="4" height="4" fill="#7048e8"/>'
        + '<rect x="58" y="108" width="34" height="22" fill="#fff" opacity="0.55"/>'
        + '<rect x="66" y="118" width="18" height="8" fill="none" stroke="#7048e8" stroke-width="3"/>'
        + wavePaw + keyboard
        + '</svg>';
    }

    /** 渲染小狐狸（狐狐） */
    function svgFox(phase) {
      const sleeping = phase === "idle" || phase === "stopped";
      const eyes = sleeping
        ? '<rect x="56" y="72" width="14" height="4" fill="#4a3f55"/><rect x="84" y="72" width="14" height="4" fill="#4a3f55"/>'
        : '<rect x="58" y="68" width="10" height="12" fill="#4a3f55"/><rect x="86" y="68" width="10" height="12" fill="#4a3f55"/>';
      const book = phase === "active"
        ? '<g class="prop-book"><rect x="24" y="124" width="40" height="28" fill="#fef3c7" stroke="#4a3f55" stroke-width="3"/><rect x="32" y="132" width="22" height="4" fill="#f97316"/><rect x="32" y="140" width="16" height="4" fill="#f97316"/></g>'
        : "";
      const wavePaw = phase === "waiting_user"
        ? '<g class="prop-wave"><rect x="116" y="84" width="10" height="18" fill="#4a3f55"/><rect x="116" y="108" width="10" height="8" fill="#4a3f55"/></g>'
        : "";
      return '<svg viewBox="0 0 150 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'
        + '<rect x="34" y="146" width="86" height="8" fill="rgba(74,63,85,0.15)"/>'
        + '<g class="pet-tail"><rect x="110" y="88" width="18" height="22" fill="#fb923c" stroke="#ea580c" stroke-width="3"/><rect x="126" y="66" width="18" height="28" fill="#fb923c" stroke="#ea580c" stroke-width="3"/><rect x="132" y="56" width="12" height="12" fill="#fed7aa"/></g>'
        + '<rect x="38" y="86" width="76" height="52" fill="#fb923c" stroke="#ea580c" stroke-width="4"/>'
        + '<polygon points="46,60 46,34 68,60" fill="#fb923c" stroke="#ea580c" stroke-width="4"/>'
        + '<polygon points="104,60 104,34 82,60" fill="#fb923c" stroke="#ea580c" stroke-width="4"/>'
        + '<rect x="46" y="56" width="58" height="48" fill="#fb923c" stroke="#ea580c" stroke-width="4"/>'
        + '<rect x="56" y="76" width="38" height="20" fill="#fed7aa"/>'
        + eyes
        + '<rect x="72" y="84" width="8" height="8" fill="#4a3f55"/>'
        + '<rect x="54" y="58" width="42" height="12" fill="none" stroke="#4a3f55" stroke-width="3" opacity="0.65"/>'
        + '<rect x="60" y="108" width="32" height="20" fill="#fff" opacity="0.45"/>'
        + book + wavePaw
        + '</svg>';
    }

    /** 渲染小猫头鹰（咕咕） */
    function svgOwl(phase) {
      const sleeping = phase === "idle" || phase === "stopped";
      const eyes = sleeping
        ? '<rect x="54" y="74" width="18" height="4" fill="#4a3f55"/><rect x="84" y="74" width="18" height="4" fill="#4a3f55"/>'
        : '<rect x="52" y="64" width="22" height="22" fill="#fff" stroke="#0d9488" stroke-width="3"/><rect x="60" y="72" width="8" height="8" fill="#4a3f55"/>'
          + '<rect x="82" y="64" width="22" height="22" fill="#fff" stroke="#0d9488" stroke-width="3"/><rect x="90" y="72" width="8" height="8" fill="#4a3f55"/>';
      const wings = phase === "active"
        ? '<g class="pet-wing"><rect x="24" y="92" width="20" height="38" fill="#99f6e4" stroke="#0d9488" stroke-width="3"/></g>'
          + '<g class="pet-wing"><rect x="110" y="92" width="20" height="38" fill="#99f6e4" stroke="#0d9488" stroke-width="3"/></g>'
        : '<rect x="26" y="96" width="18" height="30" fill="#99f6e4" stroke="#0d9488" stroke-width="3" opacity="0.6"/>'
          + '<rect x="110" y="96" width="18" height="30" fill="#99f6e4" stroke="#0d9488" stroke-width="3" opacity="0.6"/>';
      const wavePaw = phase === "waiting_user"
        ? '<g class="prop-wave"><rect x="72" y="34" width="8" height="22" fill="#4a3f55"/><rect x="72" y="62" width="8" height="8" fill="#4a3f55"/></g>'
        : "";
      return '<svg viewBox="0 0 150 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'
        + '<rect x="34" y="146" width="86" height="8" fill="rgba(74,63,85,0.15)"/>'
        + wings
        + '<rect x="42" y="58" width="66" height="78" fill="#99f6e4" stroke="#0d9488" stroke-width="4"/>'
        + '<polygon points="75,42 56,62 94,62" fill="#5eead4" stroke="#0d9488" stroke-width="4"/>'
        + eyes
        + '<rect x="72" y="88" width="10" height="8" fill="#f97316"/>'
        + '<rect x="66" y="102" width="22" height="6" fill="#0d9488"/>'
        + wavePaw
        + '</svg>';
    }

    /** 渲染睡眠态迷你宠物 */
    function svgSleeping(type) {
      const renderers = { cursor: svgCat, claude_code: svgFox, codex: svgOwl };
      return renderers[type]("idle");
    }

    const PET_RENDERERS = { cursor: svgCat, claude_code: svgFox, codex: svgOwl };

    /* ── 状态逻辑 ── */

    function phaseClass(phase) {
      switch (phase) {
        case "active": return "active";
        case "waiting_user": return "waiting";
        case "stopped": return "stopped";
        case "idle": return "idle";
        default: return "unknown";
      }
    }

    function sourceDisplayPriority(source, defaultSource) {
      if (source === defaultSource) return 0;
      const idx = SOURCE_ORDER.indexOf(source);
      return idx >= 0 ? idx + 1 : 99;
    }

    function isNearDuplicateGroup(sessions) {
      if (sessions.length < 2) return false;
      const times = sessions.map((s) => new Date(s.last_activity_at).getTime());
      return Math.max(...times) - Math.min(...times) <= NEAR_DUPLICATE_MS;
    }

    function pickSourceFromGroup(sessions, defaultSource) {
      if (isNearDuplicateGroup(sessions)) {
        const sorted = [...sessions].sort((a, b) => {
          const pa = sourceDisplayPriority(a.source, defaultSource);
          const pb = sourceDisplayPriority(b.source, defaultSource);
          if (pa !== pb) return pa - pb;
          return new Date(b.last_activity_at) - new Date(a.last_activity_at);
        });
        return sorted[0].source;
      }
      const newest = [...sessions].sort(
        (a, b) => new Date(b.last_activity_at) - new Date(a.last_activity_at)
      )[0];
      return newest.source;
    }

    function newestSession(snap, pred) {
      const candidates = (snap.sessions || []).filter((s) => pred(s.phase));
      if (!candidates.length) return null;
      const groups = new Map();
      for (const s of candidates) {
        const list = groups.get(s.session_id) || [];
        list.push(s);
        groups.set(s.session_id, list);
      }
      let best = null;
      for (const sessions of groups.values()) {
        const source = pickSourceFromGroup(sessions, DEFAULT_SOURCE);
        const at = Math.max(...sessions.map((s) => new Date(s.last_activity_at).getTime()));
        if (!best || at > best.at) best = { source, at };
      }
      return best ? best.source : null;
    }

    /** 仅返回进行中（active / waiting_user）的来源 */
    function pickActiveSource(snap) {
      return newestSession(snap, (p) => IN_PROGRESS.includes(p));
    }

    function sessionForSource(snap, source) {
      return (snap.sessions || []).find((s) => s.source === source);
    }

    function currentPhase(snap, source) {
      const session = sessionForSource(snap, source);
      const health = snap.sources?.[source];
      return session?.phase || health?.phase || "unknown";
    }

    function detailForSource(snap, source) {
      const health = snap.sources?.[source];
      const session = sessionForSource(snap, source);
      const hookInstalled = health?.hook_installed;
      const phase = currentPhase(snap, source);
      if (session?.task_title) return session.task_title;
      if (session?.cwd) return session.cwd;
      if (health?.note) return health.note;
      if (hookInstalled && phase === "unknown") return "等任务中…";
      if (hookInstalled) return "等任务中…";
      return "还没装小天线呢～";
    }

    function truncate(str, max) {
      if (!str) return "";
      return str.length <= max ? str : str.slice(0, max) + "…";
    }

    function cuteSpeech(source, phase) {
      const table = CUTE_SPEECH[source] || CUTE_SPEECH.cursor;
      return table[phase] || table.unknown;
    }

    function buildMetaHint(snap, source) {
      const session = sessionForSource(snap, source);
      if (session?.last_tool) return "刚刚用了 " + session.last_tool + " 哦 ✨";
      if (snap.lite_mode) return "省电模式开着，耳朵竖着呢～";
      return "";
    }

    /* ── 视图切换 ── */

    function setConnected(live, text) {
      connDot.className = "conn-dot " + (live ? "live" : "off");
      connText.textContent = text;
    }

    function updateScene(mode) {
      if (mode === "night") {
        sceneOverlay.className = "scene-overlay night";
      } else {
        sceneOverlay.className = "scene-overlay day";
      }
    }

    function showPetStage(source) {
      petStage.classList.remove("hidden");
      restingView.classList.add("hidden");
      updateScene("day");
    }

    function showRestingView() {
      petStage.classList.add("hidden");
      restingView.classList.remove("hidden");
      updateScene("night");
      if (!restingPets.children.length) {
        restingPets.innerHTML = SOURCE_ORDER.map((s) => svgSleeping(s)).join("");
      }
    }

    /** 渲染宠物角色到舞台 */
    function renderPet(source, phase, task, meta) {
      const pet = PETS[source] || PETS.cursor;
      const renderer = PET_RENDERERS[source] || svgCat;
      const pc = phaseClass(phase);

      petNameTag.textContent = pet.name;
      petNameTag.style.borderLeft = "3px solid " + pet.color;
      petContainer.innerHTML = renderer(phase);
      petContainer.className = "pet-container phase-" + pc;
      petStage.className = "pet-stage phase-" + pc;

      speechBubble.textContent = cuteSpeech(source, phase);
      taskBubble.textContent = truncate(task, 80) || "等任务中…";
      metaHint.textContent = meta;
    }

    function render(snap) {
      if (!snap) return;
      lastUpdate = new Date();
      const activeSource = pickActiveSource(snap);

      if (!activeSource) {
        showRestingView();
      } else {
        showPetStage(activeSource);
        const phase = currentPhase(snap, activeSource);
        const task = detailForSource(snap, activeSource);
        const meta = buildMetaHint(snap, activeSource);
        renderPet(activeSource, phase, task, meta);
      }

      const time = lastUpdate.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      setConnected(true, "💚 连着呢 · " + time);
    }

    /* ── 网络连接 ── */

    async function fetchStatus() {
      const q = token ? "?token=" + encodeURIComponent(token) : "";
      const res = await fetch("/api/status" + q);
      if (!res.ok) throw new Error("status " + res.status);
      return res.json();
    }

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        try {
          const snap = await fetchStatus();
          render(snap);
        } catch {
          setConnected(false, "💔 断开了 · 轮询失败");
        }
      }, 5000);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (_) { /* iOS 15 不支持 */ }
    }

    function connectSSE() {
      const q = "?token=" + encodeURIComponent(token);
      es = new EventSource("/api/stream" + q);
      es.onopen = () => {
        stopPolling();
        setConnected(true, "💚 实时连接中…");
        requestWakeLock();
      };
      es.onmessage = (ev) => {
        try {
          render(JSON.parse(ev.data));
        } catch (_) { /* ignore */ }
      };
      es.onerror = () => {
        es.close();
        es = null;
        setConnected(false, "💔 断开了 · 正在重连…");
        startPolling();
        setTimeout(connectSSE, 3000);
      };
    }

    function showPairing() {
      pairingView.classList.remove("hidden");
      dashboardView.classList.add("hidden");
      setConnected(false, "🐾 还没配对呢");
    }

    function showDashboard() {
      pairingView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
    }

    async function init() {
      pairingPets.innerHTML = SOURCE_ORDER.map((s) => {
        const r = PET_RENDERERS[s] || svgCat;
        return r("unknown");
      }).join("");

      if (!token) {
        showPairing();
        return;
      }
      showDashboard();
      try {
        const snap = await fetchStatus();
        render(snap);
        connectSSE();
      } catch (e) {
        if (String(e).includes("401")) {
          showPairing();
          return;
        }
        setConnected(false, "😿 连接失败 · 请检查 WiFi 与电脑看板开关");
        startPolling();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && token) {
          requestWakeLock();
          if (!es) connectSSE();
        }
      });
    }

    init();
  </script>
</body>
