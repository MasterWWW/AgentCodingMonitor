name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build vibe-hook (release)
        run: cargo build -p vibe-hook --release

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Tauri app
        working-directory: apps/desktop
        run: tauri build
        env:
          CI: true

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.app.tar.gz' \) \
            -exec cp {} release-artifacts/ \;
          echo "Collected files:"
          ls -la release-artifacts/
          test "$(ls -1 release-artifacts | wc -l)" -gt 0

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibe-monitor-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
